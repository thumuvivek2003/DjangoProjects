<h2>My Notes</h2>
<a href="{% url 'note_create' %}">+ Add New Note</a>
<ul>
    {% for note in notes %}
        <li>
            <strong>{{ note.title }}</strong><br>
            {{ note.content|linebreaks }}<br>
            <a href="{% url 'note_edit' note.pk %}">Edit</a> |
            <a href="{% url 'note_delete' note.pk %}">Delete</a>
        </li>
    {% empty %}
        <li>No notes yet.</li>
    {% endfor %}
</ul>
